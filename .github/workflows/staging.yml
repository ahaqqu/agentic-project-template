name: Staging
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  staging:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx wrangler d1 migrations apply agentic-template-db-staging --remote --env staging -c apps/api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: bun run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke health
        run: curl -sf "$STAGING_URL/v1/health" | grep -q '"status":"ok"'
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_URL }}
        continue-on-error: true
      - name: Schemathesis fuzz
        run: |
          pip install schemathesis
          schemathesis run --base-url "$STAGING_URL" "$STAGING_URL/openapi.json" --checks all || true
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
