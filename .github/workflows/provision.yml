name: Provision Cloudflare resources
on:
  workflow_dispatch:

# Creates D1 databases and R2 buckets from wrangler.toml names, then
# prints the D1 UUIDs as copy-pasteable `gh secret set` commands.
# The default GITHUB_TOKEN cannot write repository secrets, so the
# D1_DATABASE_ID / D1_DATABASE_ID_STAGING secrets must be set once
# after the first run — see the workflow output for exact commands.
permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Toolchain is pinned by the committed flake.lock (single source of
      # truth with local dev — docs/ARCHITECTURE.md §13), not floating latest.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop -c bun install --frozen-lockfile
      - name: Require secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Provision D1 + R2
        run: nix develop -c bun scripts/provision-cf.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}