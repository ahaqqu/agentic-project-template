name: Provision Cloudflare resources
on:
  workflow_dispatch:

# Setting repository secrets requires admin scope, which the default
# GITHUB_TOKEN lacks. If GH_PAT (a personal access token with repo scope)
# is set, the workflow auto-sets D1_DATABASE_ID and D1_DATABASE_ID_STAGING.
# Without GH_PAT, it creates the resources and prints the UUIDs for you
# to paste into Settings → Secrets manually.
permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Require secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Provision D1 + R2 and set secrets
        run: bun scripts/provision-cf.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # GH_PAT is optional — if set, secrets are auto-created.
          # If not set, UUIDs are printed for manual entry.
          GH_TOKEN: ${{ secrets.GH_PAT }}