name: Vulnerability scan
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Toolchain is pinned by the committed flake.lock (single source of
      # truth with local dev — docs/ARCHITECTURE.md §13), not floating latest.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop -c bun install --frozen-lockfile
      - name: OSV-Scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.0.1/osv-scanner_linux_amd64 \
            -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan --lockfile=bun.lock
      - name: Surface Dependabot alerts
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dependabot has no public "trigger re-run" API; it runs on its own
          # schedule. On an OSV failure we list open Dependabot alerts so the
          # workflow log shows what Dependabot already knows about. Requires
          # the repo setting Dependabot security alerts enabled.
          gh api repos/${{ github.repository }}/dependabot/alerts \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --jq '.[] | select(.state == "open") | [.security_advisory.ghsa_id, .dependency.package.name, .dependency.scope, .security_vulnerability.first_patched_version.identifier] | @tsv' || true
