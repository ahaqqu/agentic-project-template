name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Toolchain is pinned by the committed flake.lock (single source of
      # truth with local dev — docs/ARCHITECTURE.md §13), not floating latest.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run check
      - run: nix develop -c bun run test
      - run: nix develop -c bun run build
      - run: nix develop -c bun run size-limit
      - run: nix develop -c bun run agentic-limits
      - run: nix develop -c bun run truth
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --redact --exit-code 1
      - name: Semgrep
        run: |
          pip install --quiet semgrep
          semgrep scan --config auto --error --quiet .

  template-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Toolchain is pinned by the committed flake.lock (single source of
      # truth with local dev — docs/ARCHITECTURE.md §13), not floating latest.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop -c bun install --frozen-lockfile
      - name: Auto-seed template-sync state
        # If template-owned files match upstream main, re-seed so the gate
        # checks against the latest template. If they drifted (real drift),
        # seed refuses and the gate fails against the last known-good state.
        # --no-commit: write state file without committing (CI is ephemeral).
        # continue-on-error so the gate step is the actual gate, not the seed.
        run: nix develop -c bun run template-sync seed --ref=main --no-commit
        continue-on-error: true
      - run: nix develop -c bun run template-gate