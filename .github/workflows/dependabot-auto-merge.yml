name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Event-driven: the workflow runs once per Dependabot PR instead of a
      # scheduled poll burning runs for every open PR. Auto-merge queues the
      # squash merge and waits for the PR's required checks; only patch/minor
      # updates qualify, so major, downgrade, pre-release, and grouped updates
      # stay for human review. Requires "Allow auto-merge" in repository
      # settings (Settings -> General -> Pull Requests).
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
