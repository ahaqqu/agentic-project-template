name: E2E
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      - run: bun run build
      - run: bun run e2e
        env:
          CI: true
